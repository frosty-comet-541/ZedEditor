  <script>
    (() => {
      let t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>

  <style>
    :root {
      color-scheme: light dark;
      --console-h: 220px;
      --panel: #fafafa;
      --line: #e7e7e7;
      --line-2: #d7d7d7;
      --text: #181818;
      --muted: #737373;
      --faint: #b0b0b0;
      --hover: #ebebeb;
      --track: #ededed;
      --invert: #181818;
      --invert-fg: #fafafa;
      --jump-bg: #ffffff;
      --jump-fg: #151515;
      --sel: #dedede;
      --sel-fg: #000000;
      --shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 16px 40px rgba(0, 0, 0, .07);
      --r-lg: 14px;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --t-fast: .18s;
      --t-mid: .3s;
      --t-panel: .35s;
      --font-ui: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", "Helvetica Neue", "Yu Gothic UI", Meiryo, sans-serif;
      --font-mono: "Fira Code", "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
    }
    [data-theme="dark"] {
      --panel: #161616;
      --line: #272727;
      --line-2: #3a3a3a;
      --text: #ececec;
      --muted: #9b9b9b;
      --faint: #575757;
      --hover: #232323;
      --track: #1e1e1e;
      --invert: #ececec;
      --invert-fg: #141414;
      --jump-bg: #000000;
      --jump-fg: #ffffff;
      --sel: #3a3a3a;
      --sel-fg: #ffffff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px rgba(0, 0, 0, .35);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: pan-x pan-y;
      display: flex;
      height: 100dvh;
      padding: 10px;
      background: #ececec radial-gradient(140% 100% at 50% 0%, #f9f9f9, #ebebeb);
      color: var(--text);
      font: 500 13px/1.5 var(--font-ui);
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    [data-theme="dark"] body {
      background: #0b0b0b radial-gradient(140% 100% at 50% 0%, #171717, #0a0a0a);
    }
    ::selection { background: var(--sel); color: var(--sel-fg); }
    :focus-visible { outline: 1.5px solid var(--text); outline-offset: 2px; }
    #monaco-editor, #console-logs, #console-input { user-select: text; -webkit-user-select: text; }

    .noscript {
      position: fixed; inset: auto 16px 16px; z-index: 99;
      background: var(--text); color: var(--panel);
      padding: 14px 18px; border-radius: 10px; font-size: 13px; text-align: center;
    }

    .app { flex: 1; display: flex; gap: 10px; min-width: 0; min-height: 0; }
    .pane {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0; min-height: 0;
      transition: background-color var(--t-mid) ease, border-color var(--t-mid) ease, box-shadow var(--t-mid) ease;
    }
    #edit { flex: 0 0 calc(var(--s, 50%) - 15px); transition: flex-basis var(--t-mid) var(--ease); }
    #view-container { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    #view { flex: 1; min-height: 0; }

    .app > * { animation: rise .55s var(--ease) backwards; }
    #divider { animation-delay: .06s; }
    #view-container { animation-delay: .12s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    .pane-nav, .console-head {
      position: relative; z-index: 20;
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
      border-bottom: 1px solid var(--line);
      transition: border-color var(--t-mid) ease;
    }
    .pane-nav { min-height: 46px; padding: 6px 8px 6px 14px; }
    .console-head { min-height: 38px; padding: 4px 6px 4px 14px; }

    .brand {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--text);
    }
    .brand svg { width: 17px; height: 17px; display: block; }
    .brand .stroke { stroke: var(--panel); stroke-width: 10; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    .pane-label {
      font-size: 10px; font-weight: 600; letter-spacing: .14em;
      text-transform: uppercase; color: var(--muted);
    }
    .actions { margin-left: auto; display: flex; align-items: center; gap: 2px; }

    .btn {
      appearance: none; border: 0; cursor: pointer;
      display: inline-flex; align-items: center; height: 28px; padding: 0 11px;
      background: none; color: var(--muted);
      font: 600 10px/1 var(--font-ui);
      letter-spacing: .09em; text-transform: uppercase;
      border-radius: 999px;
      transition: color var(--t-fast) ease, background-color var(--t-fast) ease, transform var(--t-fast) var(--ease);
    }
    .btn:active { transform: scale(.95); }
    .btn.is-armed { background: var(--text); color: var(--panel); }
    .btn.is-feedback { animation: pop var(--t-panel) var(--ease); background: var(--hover); color: var(--text); }
    @keyframes pop {
      0% { transform: scale(.86); }
      60% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .export-wrap { position: relative; display: inline-flex; }
    .export-menu {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 60;
      min-width: 250px; max-width: min(300px, calc(100vw - 32px));
      padding: 5px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; box-shadow: var(--shadow);
      opacity: 0; transform: translateY(-4px) scale(.97);
      transform-origin: top right;
      visibility: hidden; pointer-events: none;
      transition: opacity var(--t-fast) ease, transform var(--t-fast) var(--ease), visibility 0s linear var(--t-fast);
    }
    .export-menu.is-open {
      opacity: 1; transform: none; visibility: visible; pointer-events: auto;
      transition-delay: 0s;
    }
    .export-menu [role="menuitem"] {
      appearance: none; border: 0; cursor: pointer; background: none;
      display: block; width: 100%; text-align: left;
      padding: 8px 11px; border-radius: 8px; color: var(--text);
      transition: background-color var(--t-fast) ease;
    }
    .export-menu [role="menuitem"]:hover { background: var(--hover); }
    .export-menu .exp-title { display: block; font: 600 12px/1.4 var(--font-ui); }
    .export-menu .exp-desc { display: block; margin-top: 1px; font: 500 10.5px/1.45 var(--font-ui); color: var(--muted); }

    .icon-btn {
      appearance: none; border: 0; cursor: pointer;
      width: 28px; height: 28px; display: grid; place-items: center;
      background: none; color: var(--muted); border-radius: 999px;
      transition: color var(--t-fast) ease, background-color var(--t-fast) ease, transform var(--t-fast) var(--ease);
    }
    .icon-btn:active { transform: scale(.9); }
    .icon-btn svg { width: 15px; height: 15px; transition: transform var(--t-panel) var(--ease), opacity var(--t-fast) ease; }

    .icon-btn.is-flash { animation: themeFlash 1s var(--ease); }
    @keyframes themeFlash {
      0%, 60% { background-color: var(--hover); color: var(--text); }
      100% { background-color: transparent; color: var(--muted); }
    }

    [data-preview-theme="light"] .preview-icon-moon,
    [data-preview-theme="dark"] .preview-icon-sun { display: none; }
    [data-preview-theme="light"] .preview-icon-sun { transform: rotate(-20deg) scale(1.04); }
    [data-preview-theme="dark"] .preview-icon-moon { transform: rotate(15deg) scale(1.04); }

    [data-tip] { position: relative; }

    .segmented {
      position: relative; display: flex; gap: 2px;
      padding: 3px; background: var(--track); border-radius: 999px;
      transition: background-color var(--t-mid) ease;
    }
    .segmented .thumb {
      position: absolute; top: 3px; bottom: 3px; left: 0;
      width: 0; border-radius: 999px; background: var(--invert);
      transition: none;
    }
    .segmented.is-ready .thumb { transition: transform var(--t-mid) var(--ease), width var(--t-mid) var(--ease), background-color var(--t-mid) ease; }
    .segmented [role="tab"] {
      position: relative; z-index: 1;
      appearance: none; border: 0; cursor: pointer; background: none;
      display: inline-flex; align-items: center; height: 22px; padding: 0 13px;
      color: var(--muted); font: 600 11px/1 var(--font-ui);
      letter-spacing: .06em; border-radius: 999px;
      transition: color var(--t-fast) ease;
    }
    .segmented [role="tab"].is-active { color: var(--invert-fg); }

    .editor-container { flex: 1; position: relative; min-height: 0; }
    .editor-container.is-swapping { animation: swapIn var(--t-mid) var(--ease); }
    @keyframes swapIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    #monaco-editor { width: 100%; height: 100%; touch-action: none; }

    #monaco-editor .monaco-scrollable-element > .scrollbar { background: transparent !important; }
    #monaco-editor .monaco-scrollable-element > .scrollbar > .slider {
      background: var(--line-2) !important;
      background-clip: padding-box;
      border: 4px solid var(--panel);
      border-radius: 999px;
      transition: background-color var(--t-fast) ease, border-width var(--t-fast) ease;
    }
    #monaco-editor .monaco-scrollable-element > .scrollbar > .slider:hover,
    #monaco-editor .monaco-scrollable-element > .scrollbar > .slider.active {
      background: var(--muted) !important;
      background-clip: padding-box;
      border-width: 2px;
    }
    #monaco-editor .monaco-scrollable-element > .shadow { display: none; }

    .preview-wrapper { flex: 1; min-height: 0; position: relative; }
    .preview-wrapper.is-fading { animation: previewFade var(--t-mid) var(--ease); }
    @keyframes previewFade {
      from { opacity: .35; }
      to { opacity: 1; }
    }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    #console-pane {
      flex: 0 0 auto;
      display: grid; grid-template-rows: var(--console-h);
      transition: grid-template-rows var(--t-panel) var(--ease), opacity var(--t-fast) ease;
    }
    #console-pane.is-hidden { grid-template-rows: 0px; opacity: 0; pointer-events: none; }
    .console-clip { overflow: hidden; min-height: 0; visibility: visible; }
    #console-pane.is-hidden .console-clip { visibility: hidden; transition: visibility 0s var(--t-panel); }
    .console-card {
      position: relative;
      height: 100%; display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--r-lg); box-shadow: var(--shadow);
      transition: background-color var(--t-mid) ease, border-color var(--t-mid) ease;
    }
    #console-logs {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 10px 14px;
      font: 12px/1.55 var(--font-mono);
      -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
    }
    #console-logs::-webkit-scrollbar { width: 14px; }
    #console-logs::-webkit-scrollbar-thumb { background: var(--line-2); border: 4px solid var(--panel); border-radius: 999px; }
    #console-logs::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    @supports not selector(::-webkit-scrollbar) {
      #console-logs { scrollbar-width: auto; scrollbar-color: var(--line-2) transparent; }
    }
    #console-logs:empty::before { content: "ログはまだありません。"; display: block; color: var(--faint); }
    .log {
      display: grid; grid-template-columns: 14px 1fr; gap: 8px;
      padding: 4px 0; border-bottom: 1px solid var(--line);
      animation: logIn var(--t-fast) var(--ease);
    }
    @keyframes logIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: none; }
    }
    .log .g { color: var(--faint); user-select: none; }
    .log .msg { word-break: break-word; white-space: pre-wrap; }
    .log.error { font-weight: 700; }
    .log.error .g { color: var(--text); }
    .log.warn .g { color: var(--muted); }
    .log.input, .log.input .g { color: var(--text); font-weight: 600; }
    .log:last-child { border-bottom: 0; }
    .console-jump {
      position: absolute; right: 14px; bottom: calc(100% + 15px); z-index: 5;
      appearance: none; border: 1px solid var(--line-2); cursor: pointer;
      width: 44px; height: 44px; display: grid; place-items: center;
      background: var(--jump-bg); color: var(--jump-fg);
      border-radius: 999px; box-shadow: 0 4px 14px rgba(0, 0, 0, .16);
      opacity: 0; transform: translateY(4px); pointer-events: none;
      transition: opacity var(--t-fast) ease, transform var(--t-fast) var(--ease), background-color var(--t-fast) ease, border-color var(--t-fast) ease;
    }
    .console-jump.is-visible { opacity: 1; transform: none; pointer-events: auto; }
    .console-jump.is-visible:active { transform: scale(.92); }
    .console-jump svg { width: 20px; height: 20px; }
    @media (hover: hover) {
      .console-jump.is-visible:hover { background: #f0f0f0; }
      [data-theme="dark"] .console-jump.is-visible:hover { background: #1c1c1c; }
    }
    .console-input-row {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-top: 1px solid var(--line);
      transition: background-color var(--t-fast) ease, border-color var(--t-mid) ease;
    }
    .console-input-row:focus-within { background: var(--hover); }
    .console-input-row .g { color: var(--muted); font-weight: 700; font-family: var(--font-mono); }
    #console-input {
      flex: 1; border: 0; outline: 0; background: none;
      color: var(--text); caret-color: var(--text);
      font: 12px/1.4 var(--font-mono); padding: 4px 0;
    }
    #console-input::placeholder { color: var(--faint); }

    #divider { flex: 0 0 10px; position: relative; cursor: col-resize; touch-action: none; border-radius: 999px; }
    #divider::after {
      content: ""; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 4px; height: 44px; border-radius: 999px;
      background: var(--line-2);
      transition: background-color var(--t-fast) ease, height var(--t-mid) var(--ease), width var(--t-mid) var(--ease);
    }
    body.is-dragging #divider::after { background: var(--muted); height: 56px; }
    #divider:focus-visible::after { background: var(--text); }
    body.is-dragging { cursor: col-resize; }
    body.is-dragging iframe { pointer-events: none; }

    @media (hover: hover) {
      .btn:not(.is-armed):hover { color: var(--text); background: var(--hover); }
      .icon-btn:hover { color: var(--text); background: var(--hover); }
      .segmented [role="tab"]:hover { color: var(--text); }
      #divider:hover::after { background: var(--muted); height: 56px; }
      [data-tip]::after {
        content: attr(data-tip);
        position: absolute; top: calc(100% + 8px); right: 0;
        background: var(--invert); color: var(--invert-fg);
        font: 600 10px/1 var(--font-ui); letter-spacing: .02em;
        padding: 6px 9px; border-radius: 7px; white-space: nowrap;
        opacity: 0; pointer-events: none;
        transform: translateY(-2px);
        transition: opacity var(--t-fast) ease var(--t-mid), transform var(--t-fast) var(--ease) var(--t-mid);
      }
      [data-tip]:hover::after { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      :root { --console-h: 180px; }
      body { padding: 8px; }
      .app { flex-direction: column; gap: 8px; }
      #view-container { gap: 8px; }
      #edit { flex: 0 0 calc(var(--s, 50%) - 13px); }
      #divider { flex: 0 0 10px; cursor: row-resize; }
      #divider::after { width: 44px; height: 4px; }
      body.is-dragging #divider::after { width: 56px; height: 4px; }
      .btn { padding: 0 9px; }
      .brand { font-size: 12px; }
    }

    @media (hover: hover) and (max-width: 720px) {
      #divider:hover::after { width: 56px; height: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <noscript>
    <div class="noscript">SuiEditor の利用には JavaScript が必要です。ブラウザの設定をご確認ください。</div>
  </noscript>

  <main class="app">
    <section class="pane" id="edit" aria-label="コードエディタ">
      <nav class="pane-nav" aria-label="エディタ操作">
        <h1 class="brand">
          <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect width="100" height="100" rx="26" fill="currentColor"/><path class="stroke" d="M34 36 48 50 34 64"/><path class="stroke" d="M56 34 70 66"/></svg>
          SuiEditor
        </h1>
        <div class="segmented" role="tablist" aria-label="編集するコード">
          <span class="thumb" aria-hidden="true"></span>
          <button type="button" role="tab" data-tab="html" class="is-active" aria-selected="true">HTML</button>
          <button type="button" role="tab" data-tab="css" aria-selected="false">CSS</button>
          <button type="button" role="tab" data-tab="javascript" aria-selected="false">JS</button>
        </div>
        <div class="actions">
          <button type="button" id="btn-format" class="btn" data-tip="コードを整形（Prettier / 予備エンジン）">Format</button>
          <button type="button" id="btn-copy" class="btn" data-tip="現在のタブのコードをコピー">Copy</button>
          <button type="button" id="btn-clear" class="btn" data-tip="すべてのコードを削除">Clear</button>
          <button type="button" id="btn-import" class="btn" data-tip="HTML / CSS / JS ファイルを読み込む">Import</button>
          <div class="export-wrap">
            <button type="button" id="btn-dl" class="btn" data-tip="一括 / 分割を選んで書き出し" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">Export</button>
            <div class="export-menu" id="export-menu" role="menu" aria-label="書き出し形式を選択">
              <button type="button" role="menuitem" data-export="single">
                <span class="exp-title">一括（1ファイル）</span>
                <span class="exp-desc">外部参照の CSS・JS を HTML に統合して index.html を書き出します</span>
              </button>
              <button type="button" role="menuitem" data-export="split">
                <span class="exp-title">分割（3ファイル）</span>

      <div class="editor-container">
        <div id="monaco-editor"></div>

    </section>

    <div id="divider" role="separator" aria-orientation="vertical" aria-label="エディタとプレビューの境界" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0"></div>

    <div id="view-container">
      <section class="pane" id="view" aria-label="プレビュー">
        <nav class="pane-nav" aria-label="プレビュー操作">
          <span class="pane-label">Preview</span>
          <div class="actions">
            <button type="button" id="preview-theme-toggle" class="icon-btn" data-tip="プレビューのテーマを切り替え" aria-label="プレビューのテーマを切り替え" aria-pressed="false">
              <svg class="preview-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
              <svg class="preview-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button type="button" id="btn-toggle-console" class="btn" data-tip="コンソールの表示切り替え" aria-controls="console-pane" aria-expanded="false">Console</button>
          </div>
        </nav>
        <div class="preview-wrapper">
          <iframe id="preview" title="SuiEditor プレビュー" sandbox="allow-scripts allow-forms allow-modals"></iframe>
        </div>
      </section>

      <section id="console-pane" class="is-hidden" role="region" aria-label="コンソール">
        <div class="console-clip">
          <div class="console-card">
            <nav class="console-head" aria-label="コンソール操作">
              <span class="pane-label">Console</span>
              <div class="actions">
                <button type="button" id="btn-clear-console" class="btn" data-tip="ログを消去">Clear</button>
              </div>

              <span class="g" aria-hidden="true">&rsaquo;</span>
              <input type="text" id="console-input" placeholder="JavaScriptを実行" aria-label="プレビュー内でJavaScriptを実行" autocomplete="off" autocapitalize="off" spellcheck="false">
              <button type="button" id="console-jump" class="console-jump" aria-label="最新のログまでスクロール">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (() => {
      'use strict';
      const $ = (s, el = document) => el.querySelector(s);
      const preview = $('#preview'), divider = $('#divider'), view = $('#view');
      const consoleLogs = $('#console-logs'), consolePane = $('#console-pane'), jumpBtn = $('#console-jump');
      const seg = $('.segmented'), thumb = $('.thumb', seg);
      const tabs = [...seg.querySelectorAll('[role="tab"]')];
      const FINE_POINTER = matchMedia('(hover: hover) and (pointer: fine)');

      document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
      document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
      addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) e.preventDefault(); }, { passive: false });

      document.addEventListener('pointerdown', e => {
        if (e.target.closest?.('button, #console-input')) {
          const sel = getSelection();
          if (sel && !sel.isCollapsed) sel.removeAllRanges();
        }
        if (!e.target.closest?.('.export-wrap')) closeExportMenu();
      });

      const store = {
        get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
        set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
      };

      const initialCode = {
        html: '<div class="container">\n  <h1>こんにちは、SuiEditorへようこそ！</h1>\n  <p>コードを編集すると、リアルタイムでプレビューが更新されます。</p>\n</div>',
        css: ':root {\n  --bg: #ffffff;\n  --text: #1e1e1e;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root {\n    --bg: #1a1a1a;\n    --text: #e7e7e7;\n  }\n}\n\nbody {\n  font-family: system-ui, -apple-system, sans-serif;\n  display: grid;\n  place-items: center;\n  min-height: 100vh;\n  margin: 0;\n  background-color: var(--bg);\n  color: var(--text);\n  transition:\n    background-color 0.2s cubic-bezier(0.16, 1, 0.3, 1),\n    color 0.2s cubic-bezier(0.16, 1, 0.3, 1);\n}\n\n.container {\n  text-align: center;\n  padding: 2rem;\n  animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;\n}\n\n@keyframes fadeIn {\n  from {\n    opacity: 0;\n    transform: translateY(8px);\n  }\n  to {\n    opacity: 1;\n    transform: translateY(0);\n  }\n}',
        javascript: 'console.log("SuiEditorの準備が完了しました。");'
      };
      const code = { ...initialCode, ...store.get('code', {}) };

      let currentTab = 'html', editor = null, renderTimer = null, saveTimer = null;
      const models = {}, viewStates = {};

      const saveCode = () => {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => store.set('code', code), 500);
      };
      addEventListener('pagehide', () => store.set('code', code));

      const themeToggle = $('#preview-theme-toggle');
      let previewTheme = store.get('preview-theme', document.documentElement.dataset.theme) === 'dark' ? 'dark' : 'light';
      view.dataset.previewTheme = previewTheme;
      themeToggle.setAttribute('aria-pressed', String(previewTheme === 'dark'));

      function applyPreviewTheme(next) {
        previewTheme = next === 'dark' ? 'dark' : 'light';
        view.dataset.previewTheme = previewTheme;
        themeToggle.setAttribute('aria-pressed', String(previewTheme === 'dark'));
        store.set('preview-theme', previewTheme);
        render();
        pulsePreview();
      }

      const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min';
      const suiTheme = () => document.documentElement.dataset.theme === 'dark' ? 'sui-dark' : 'sui-light';

      function defineSuiThemes() {
        monaco.editor.defineTheme('sui-light', {
          base: 'vs', inherit: true,
          rules: [
            { token: 'comment', foreground: '008000' },
            { token: 'string', foreground: 'A31515' },
            { token: 'number', foreground: '098658' },
            { token: 'regexp', foreground: '811F3F' },
            { token: 'keyword', foreground: '0000FF' },
            { token: 'type', foreground: '267F99' },
            { token: 'type.identifier', foreground: '267F99' },
            { token: 'identifier', foreground: '001080' },
            { token: 'variable', foreground: '001080' },
            { token: 'variable.predefined', foreground: '0070C1' },
            { token: 'constant', foreground: '0070C1' },
            { token: 'delimiter', foreground: '3c3c3c' },
            { token: 'delimiter.html', foreground: '800000' },
            { token: 'tag', foreground: '800000' },
            { token: 'tag.css', foreground: '800000' },
            { token: 'metatag', foreground: '800000' },
            { token: 'attribute.name', foreground: 'E50000' },
            { token: 'attribute.value', foreground: '0000FF' },
            { token: 'attribute.value.number', foreground: '098658' },
            { token: 'attribute.value.unit', foreground: '098658' },
            { token: 'attribute.value.hex', foreground: '098658' },
            { token: 'annotation', foreground: '795E26' },
            { token: 'invalid', foreground: 'CD3131' }
          ],
          colors: {
            'editor.background': '#FFFFFF',
            'editor.foreground': '#000000',
            'editorLineNumber.foreground': '#A6A6A6',
            'editorLineNumber.activeForeground': '#181818',
            'editorCursor.foreground': '#000000',
            'editor.lineHighlightBackground': '#0000000A',
            'editor.selectionBackground': '#D6D6D6',
            'editor.inactiveSelectionBackground': '#ECECEC',
            'editorIndentGuide.background1': '#D3D3D3',
            'editorIndentGuide.activeBackground1': '#939393',
            'editorWidget.background': '#F3F3F3',
            'editorWidget.border': '#C8C8C8',
            'editorBracketMatch.background': '#0064001A',
            'editorBracketMatch.border': '#00640040',
            'scrollbarSlider.background': '#00000026',
            'scrollbarSlider.hoverBackground': '#00000042',
            'scrollbarSlider.activeBackground': '#00000059'
          }
        });
        monaco.editor.defineTheme('sui-dark', {
          base: 'vs-dark', inherit: true,
          rules: [
            { token: 'comment', foreground: '6A9955' },
            { token: 'string', foreground: 'CE9178' },
            { token: 'number', foreground: 'B5CEA8' },
            { token: 'regexp', foreground: 'D16969' },
            { token: 'keyword', foreground: '569CD6' },
            { token: 'type', foreground: '4EC9B0' },
            { token: 'type.identifier', foreground: '4EC9B0' },
            { token: 'identifier', foreground: '9CDCFE' },
            { token: 'variable', foreground: '9CDCFE' },
            { token: 'variable.predefined', foreground: '4FC1FF' },
            { token: 'constant', foreground: '4FC1FF' },
            { token: 'delimiter', foreground: 'D4D4D4' },
            { token: 'delimiter.html', foreground: '808080' },
            { token: 'tag', foreground: '569CD6' },
            { token: 'tag.css', foreground: 'D7BA7D' },
            { token: 'metatag', foreground: '808080' },
            { token: 'attribute.name', foreground: '9CDCFE' },
            { token: 'attribute.value', foreground: 'CE9178' },
            { token: 'attribute.value.number', foreground: 'B5CEA8' },
            { token: 'attribute.value.unit', foreground: 'B5CEA8' },
            { token: 'attribute.value.hex', foreground: 'B5CEA8' },
            { token: 'annotation', foreground: 'DCDCAA' },
            { token: 'invalid', foreground: 'F14C4C' }
          ],
          colors: {
            'editor.background': '#1E1E1E',
            'editor.foreground': '#D4D4D4',
            'editorLineNumber.foreground': '#8B8B8B',
            'editorLineNumber.activeForeground': '#D4D4D4',
            'editorCursor.foreground': '#AEAFAD',
            'editor.lineHighlightBackground': '#FFFFFF0A',
            'editor.selectionBackground': '#404040',
            'editor.inactiveSelectionBackground': '#2D2D2D',
            'editorIndentGuide.background1': '#404040',
            'editorIndentGuide.activeBackground1': '#707070',
            'editorWidget.background': '#252526',
            'editorWidget.border': '#454545',
            'editorBracketMatch.background': '#88888821',
            'editorBracketMatch.border': '#88888857',
            'scrollbarSlider.background': '#79797966',
            'scrollbarSlider.hoverBackground': '#646464B3',
            'scrollbarSlider.activeBackground': '#BFBFBF66'
          }
        });
      }

      function initEditor() {
        defineSuiThemes();
        if (window.emmetMonaco) {
          emmetMonaco.emmetHTML(monaco);
          emmetMonaco.emmetCSS(monaco);
        }
        for (const lang of ['html', 'css', 'javascript']) {
          models[lang] = monaco.editor.createModel(code[lang], lang);
          models[lang].onDidChangeContent(() => {
            code[lang] = models[lang].getValue();
            saveCode();
            clearTimeout(renderTimer);
            renderTimer = setTimeout(render, 160);
          });
        }
        editor = monaco.editor.create($('#monaco-editor'), {
          model: models[currentTab],
          theme: suiTheme(),
          fontFamily: '"Fira Code", "SF Mono", ui-monospace, Menlo, Consolas, monospace',
          fontLigatures: true,
          fontSize: 14,
          lineHeight: 23,
          tabSize: 2,
          wordWrap: 'on',
          minimap: { enabled: false },
          scrollBeyondLastLine: false,
          folding: true,
          smoothScrolling: true,
          cursorBlinking: 'smooth',
          cursorSmoothCaretAnimation: 'on',
          renderLineHighlightOnlyWhenFocus: true,
          occurrencesHighlight: 'off',
          selectionHighlight: false,
          padding: { top: 12, bottom: 12 },
          automaticLayout: true,
          overviewRulerLanes: 0,
          hideCursorInOverviewRuler: true,
          overviewRulerBorder: false,
          bracketPairColorization: { enabled: false },
          guides: { bracketPairs: false },
          scrollbar: {
            verticalScrollbarSize: FINE_POINTER.matches ? 14 : 16,
            horizontalScrollbarSize: FINE_POINTER.matches ? 14 : 16,
            useShadows: false,
            verticalHasArrows: false,
            horizontalHasArrows: false,
            vertical: 'visible'
          }
        });
        matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', e => {
          document.documentElement.dataset.theme = e.matches ? 'dark' : 'light';
          monaco.editor.setTheme(suiTheme());
          if (store.get('preview-theme', null) === null) applyPreviewTheme(e.matches ? 'dark' : 'light');
        });
        clampDivider();
      }

      if (typeof require === 'undefined') {
        editorFallback('エディタの読み込みに失敗しました。ネットワークをご確認ください。');
      } else {
        window.MonacoEnvironment = {
          getWorkerUrl: () => 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
            "self.MonacoEnvironment={baseUrl:'" + MONACO_BASE + "/'};importScripts('" + MONACO_BASE + "/vs/base/worker/workerMain.js');")
        };
        require.config({
          paths: { vs: MONACO_BASE + '/vs' },
          'vs/nls': { availableLanguages: { '*': 'ja' } }
        });
        require(['vs/editor/editor.main'], initEditor, () => editorFallback('エディタの読み込みに失敗しました。'));
      }

      function editorFallback(msg) {
        const box = $('#monaco-editor');
        box.textContent = msg;
        box.style.cssText = 'padding:18px;color:var(--muted);font-size:12px;';
      }

      function positionThumb() {
        const active = tabs.find(b => b.dataset.tab === currentTab);
        if (!active) return;
        thumb.style.width = active.offsetWidth + 'px';
        thumb.style.transform = 'translateX(' + active.offsetLeft + 'px)';
      }

      function setTab(lang) {
        if (editor) viewStates[currentTab] = editor.saveViewState();
        currentTab = lang;
        tabs.forEach(b => {
          const on = b.dataset.tab === lang;
          b.classList.toggle('is-active', on);
          b.setAttribute('aria-selected', on);
        });
        if (editor && models[lang]) {
          editor.setModel(models[lang]);
          if (viewStates[lang]) editor.restoreViewState(viewStates[lang]);
          if (FINE_POINTER.matches) editor.focus();
        }
        replayAnim($('.editor-container'), 'is-swapping');
        positionThumb();
      }

      tabs.forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
      seg.addEventListener('keydown', e => {
        if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
        e.preventDefault();
        const i = tabs.findIndex(b => b.dataset.tab === currentTab);
        const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
        setTab(next.dataset.tab);
        next.focus();
      });

      document.addEventListener('keydown', e => {
        const mod = e.ctrlKey || e.metaKey;
        if (mod && (e.key === 'Enter' || e.key.toLowerCase() === 's')) {
          e.preventDefault();
          render();
          pulsePreview();
          return;
        }
        if (mod && ['+', '-', '=', '_', '0'].includes(e.key)) e.preventDefault();
        if (e.key === 'Escape') {
          closeExportMenu();
          if (!e.target.closest?.('#monaco-editor') &&
              !consolePane.classList.contains('is-hidden')) {
            btnConsole.click();
          }
        }
      });

      const consoleScript = `
      <script>
        (function() {
          function format(a) {
            if (a instanceof Error) return a.stack || (a.name + ': ' + a.message);
            var t = typeof a;
            if (t === 'function') return '[Function ' + (a.name || 'anonymous') + ']';
            if (a === null || t !== 'object') return String(a);
            try {
              var seen = new WeakSet();
              return JSON.stringify(a, function(k, v) {
                if (v instanceof Error) return v.name + ': ' + v.message;
                if (typeof v === 'function') return '[Function]';
                if (typeof v === 'bigint') return String(v) + 'n';
                if (v instanceof Map) return { Map: Array.from(v) };
                if (v instanceof Set) return { Set: Array.from(v) };
                if (v && typeof v === 'object') { if (seen.has(v)) return '[Circular]'; seen.add(v); }
                return v;
              });
            } catch (e) { return String(a); }
          }
          function send(level, args) {
            window.parent.postMessage({
              type: 'console',
              level: level,
              msg: Array.prototype.map.call(args, format).join(' ')
            }, '*');
          }
          ['log', 'info', 'debug', 'warn', 'error'].forEach(function(m) {
            var orig = console[m];
            var level = (m === 'warn' || m === 'error') ? m : 'log';
            console[m] = function() { orig.apply(console, arguments); send(level, arguments); };
          });
          window.addEventListener('error', function(e) {
            send('error', [e.message + (e.lineno ? ' (Line ' + e.lineno + ')' : '')]);
          });
          window.addEventListener('unhandledrejection', function(e) {
            send('error', ['Unhandled rejection: ' + format(e.reason)]);
          });
          window.addEventListener('message', function(e) {
            if (e.source !== window.parent || !e.data || e.data.type !== 'eval' || typeof e.data.cmd !== 'string') return;
            try {
              var r = (0, eval)(e.data.cmd);
              if (r && typeof r.then === 'function') {
                r.then(function(v) { send('log', [v]); }, function(err) { send('error', [err]); });
              } else { send('log', [r]); }
            } catch (err) { send('error', [err]); }
          });
        })();
      <\/script>
    `;

      function adaptCss(css, theme) {
        return css.replace(/\(\s*prefers-color-scheme\s*:\s*(light|dark)\s*\)/gi,
          (_, mode) => mode.toLowerCase() === theme ? '(min-width: 0px)' : '(min-width: 999999px)');
      }

      function buildDocument() {
        const js = '<script>' + code.javascript.replace(/<\/script/gi, '<\\/script') + '<\/script>';
        return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">' +
          '<style>:root{color-scheme:' + previewTheme + '}</style><style>' + adaptCss(code.css, previewTheme) +
          '</style></head><body>' + code.html + consoleScript + js + '</body></html>';
      }

      function composeDocument(html, cssBlock, jsBlock) {
        html = String(html ?? '').replace(/\r\n?/g, '\n').trim();
        if (!/<!doctype\s+html|<html[\s>]|<head[\s>]|<body[\s>]|<\/head|<\/body|<\/html/i.test(html)) {
          let out = '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n';
          if (cssBlock) out += cssBlock + '\n';
          out += '</head>\n<body>\n' + html + '\n';
          if (jsBlock) out += jsBlock + '\n';
          return out + '</body>\n</html>';
        }
        let out = html;
        const has = re => re.test(out);
        if (!has(/<body[\s>]|<\/body\s*>/i)) {
          const skeleton = '<head>\n<meta charset="utf-8">\n</head>\n<body>';
          if (has(/<\/head\s*>/i)) out = out.replace(/<\/head\s*>/i, m => m + '\n<body>');
          else if (has(/<html(\s[^>]*)?>/i)) out = out.replace(/<html(\s[^>]*)?>/i, m => m + '\n' + skeleton);
          else if (has(/<!doctype\s+html[^>]*>/i)) out = out.replace(/<!doctype\s+html[^>]*>/i, m => m + '\n' + skeleton);
          else out = skeleton + '\n' + out;
          out = has(/<\/html\s*>/i)
            ? out.replace(/<\/html\s*>/i, m => '</body>\n' + m)
            : out + '\n</body>';
        }
        if (!has(/<head[\s>]|<\/head\s*>/i) && has(/<body(\s[^>]*)?>/i)) {
          out = out.replace(/<body(\s[^>]*)?>/i, m => '<head>\n<meta charset="utf-8">\n</head>\n' + m);
        }
        if (has(/<body(\s[^>]*)?>/i) && !has(/<\/body\s*>/i)) {
          out = has(/<\/html\s*>/i)
            ? out.replace(/<\/html\s*>/i, m => '</body>\n' + m)
            : out + '\n</body>';
        }
        if (!has(/<html[\s>]/i)) {
          out = has(/<head(\s[^>]*)?>/i)
            ? out.replace(/<head(\s[^>]*)?>/i, m => '<html>\n' + m)
            : has(/<body(\s[^>]*)?>/i)
              ? out.replace(/<body(\s[^>]*)?>/i, m => '<html>\n' + m)
              : '<html>\n' + out;
        }
        if (!has(/<\/html\s*>/i)) out += '\n</html>';
        if (!has(/<!doctype\s+html/i)) out = '<!DOCTYPE html>\n' + out;
        if (cssBlock) {
          if (has(/<\/head\s*>/i)) out = out.replace(/<\/head\s*>/i, m => cssBlock + '\n' + m);
          else if (has(/<body(\s[^>]*)?>/i)) out = out.replace(/<body(\s[^>]*)?>/i, m => m + '\n' + cssBlock);
          else out = cssBlock + '\n' + out;
        }
        if (jsBlock) {
          if (has(/<\/body\s*>/i)) out = out.replace(/<\/body\s*>/i, m => jsBlock + '\n' + m);
          else if (has(/<body(\s[^>]*)?>/i)) out = out.replace(/<body(\s[^>]*)?>/i, m => m + '\n' + jsBlock);
          else if (has(/<\/html\s*>/i)) out = out.replace(/<\/html\s*>/i, m => jsBlock + '\n' + m);
          else out += '\n' + jsBlock;
        }
        return out;
      }

      function composeExport(html, css, js) {
        html = String(html ?? '').replace(/\r\n?/g, '\n');
        const cssBlock = css ? '<style>\n' + css + '\n</style>' : '';
        const jsBlock = js ? '<script>\n' + js.replace(/<\/script/gi, '<\\/script') + '\n<\/script>' : '';
        const hasCssRef = /<link\b[^>]*\bhref\s*=\s*["']?(?:\.\/)?style\.css(?=["'\s>?#])/i.test(html);
        const hasJsRef = /<script\b[^>]*\bsrc\s*=\s*["']?(?:\.\/)?script\.js(?=["'\s>?#])/i.test(html);
        if (hasCssRef) {
          let merged = false;
          html = html.replace(/<link\b[^>]*\bhref\s*=\s*["']?(?:\.\/)?style\.css(?=["'\s>?#])(?:[?#][^"'>]*)?["']?[^>]*>/gi, () => {
            if (merged) return '';
            merged = true;
            return cssBlock;
          });
        }
        if (hasJsRef) {
          let merged = false;
          html = html.replace(/<script\b[^>]*\bsrc\s*=\s*["']?(?:\.\/)?script\.js(?=["'\s>?#])(?:[?#][^"'>]*)?["']?[^>]*>\s*<\/script>/gi, () => {
            if (merged) return '';
            merged = true;
            return jsBlock;
          });
        }
        return composeDocument(html, hasCssRef ? '' : cssBlock, hasJsRef ? '' : jsBlock);
      }

      function buildSplitFiles() {
        const ex = extractCode(code.html);
        const css = [code.css.trim(), ex.styles.join('\n\n')].filter(Boolean).join('\n\n');
        const js = [code.javascript.trim(), ex.scripts.join('\n\n')].filter(Boolean).join('\n\n');
        const hasCssRef = /<link\b[^>]*\bhref\s*=\s*["']?(?:\.\/)?style\.css(?=["'\s>?#])/i.test(ex.html);
        const hasJsRef = /<script\b[^>]*\bsrc\s*=\s*["']?(?:\.\/)?script\.js(?=["'\s>?#])/i.test(ex.html);
        const html = composeDocument(ex.html,
          css && !hasCssRef ? '<link rel="stylesheet" href="style.css">' : '',
          js && !hasJsRef ? '<script src="script.js"><\/script>' : '');
        const files = [{ name: 'index.html', text: html + '\n' }];
        if (css) files.push({ name: 'style.css', text: css + '\n' });
        if (js) files.push({ name: 'script.js', text: js + '\n' });
        return files;
      }

      function render() {
        consoleLogs.textContent = '';
        jumpBtn.classList.remove('is-visible');
        preview.srcdoc = buildDocument();
      }

      const isNearBottom = () => consoleLogs.scrollHeight - consoleLogs.scrollTop - consoleLogs.clientHeight < 40;
      consoleLogs.addEventListener('scroll', () => {
        jumpBtn.classList.toggle('is-visible', consoleLogs.childElementCount > 0 && !isNearBottom());
      }, { passive: true });
      jumpBtn.addEventListener('click', () => {
        consoleLogs.scrollTo({ top: consoleLogs.scrollHeight, behavior: 'smooth' });
      });

      function appendLog(level, msg) {
        const row = document.createElement('div');
        row.className = 'log ' + level;
        const g = document.createElement('span');
        g.className = 'g';
        g.textContent = level === 'error' ? '×' : level === 'warn' ? '!' : level === 'input' ? '›' : '·';
        const body = document.createElement('span');
        body.className = 'msg';
        body.textContent = msg;
        row.append(g, body);
        const stick = isNearBottom();
        consoleLogs.append(row);
        while (consoleLogs.childElementCount > 500) consoleLogs.firstElementChild.remove();
        if (stick) consoleLogs.scrollTop = consoleLogs.scrollHeight;
      }

      window.addEventListener('message', e => {
        if (e.source !== preview.contentWindow || !e.data || e.data.type !== 'console') return;
        const level = ['log', 'warn', 'error'].includes(e.data.level) ? e.data.level : 'log';
        const msg = typeof e.data.msg === 'string' ? e.data.msg.slice(0, 10000) : String(e.data.msg);
        appendLog(level, msg);
      });

      const consoleInput = $('#console-input');
      consoleInput.addEventListener('keydown', e => {
        if (e.key !== 'Enter' || e.isComposing || !e.target.value.trim()) return;
        appendLog('input', e.target.value);
        preview.contentWindow?.postMessage({ type: 'eval', cmd: e.target.value }, '*');
        e.target.value = '';
      });

      consoleInput.addEventListener('focus', () => {
        consoleLogs.scrollTop = consoleLogs.scrollHeight;
        setTimeout(clampDivider, 60);
        setTimeout(clampDivider, 350);
      });

      const btnConsole = $('#btn-toggle-console');
      btnConsole.addEventListener('click', () => {
        const open = !consolePane.classList.toggle('is-hidden');
        btnConsole.classList.toggle('is-armed', open);
        btnConsole.setAttribute('aria-expanded', String(open));
        requestAnimationFrame(clampDivider);
        setTimeout(clampDivider, 420);
      });

      $('#btn-clear-console').addEventListener('click', () => {
        consoleLogs.textContent = '';
        jumpBtn.classList.remove('is-visible');
      });

      let themeFlashTimer = null;
      themeToggle.addEventListener('click', () => {
        applyPreviewTheme(previewTheme === 'dark' ? 'light' : 'dark');
        themeToggle.classList.remove('is-flash');
        void themeToggle.offsetWidth;
        themeToggle.classList.add('is-flash');
        clearTimeout(themeFlashTimer);
        themeFlashTimer = setTimeout(() => themeToggle.classList.remove('is-flash'), 1000);
      });

      function replayAnim(el, cls) {
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
      }
      function pulsePreview() { replayAnim($('.preview-wrapper'), 'is-fading'); }

      function flash(btn, label) {
        if (btn.dataset.busy) return;
        btn.dataset.busy = '1';
        if (!btn.dataset.orig) btn.dataset.orig = btn.textContent;
        btn.textContent = label;
        btn.classList.add('is-feedback');
        setTimeout(() => {
          btn.textContent = btn.dataset.orig;
          btn.classList.remove('is-feedback');
          delete btn.dataset.busy;
        }, 1200);
      }

      const PRETTIER_OPTS = {
        printWidth: 80, tabWidth: 2, useTabs: false,
        singleQuote: false, semi: true, trailingComma: 'all',
        bracketSpacing: true, arrowParens: 'always', endOfLine: 'lf'
      };

      async function formatWithPrettier(text, lang) {
        if (typeof prettier === 'undefined' || !window.prettierPlugins) return null;
        const parser = { css: 'css', javascript: 'babel', html: 'html' }[lang];
        if (!parser) return null;
        try {
          const plugins = Object.values(window.prettierPlugins).filter(Boolean);
          const out = await prettier.format(text, { ...PRETTIER_OPTS, parser, plugins });
          return typeof out === 'string' && out.length ? out : null;
        } catch {
          return null;
        }
      }

      function formatWithBeautify(text, lang) {
        const fn = { css: window.css_beautify, javascript: window.js_beautify, html: window.html_beautify }[lang];
        if (typeof fn !== 'function') return null;
        try {
          const opts = {
            indent_size: 2, indent_char: ' ', wrap_line_length: 80,
            preserve_newlines: true, max_preserve_newlines: 2, end_with_newline: false
          };
          if (lang === 'html') Object.assign(opts, { indent_inner_html: true, extra_liners: [] });
          if (lang === 'css') Object.assign(opts, { selector_separator_newline: true });
          if (lang === 'javascript') Object.assign(opts, { brace_style: 'collapse,preserve-inline' });
          const out = fn(text, opts);
          return typeof out === 'string' && out.trim() ? out : null;
        } catch {
          return null;
        }
      }

      async function formatCode(text, lang) {
        if (!text || !text.trim()) return text;
        const engines = [formatWithPrettier, formatWithBeautify];
        for (const engine of engines) {
          const out = await engine(text, lang);
          if (typeof out === 'string' && out.length) return out;
        }
        return null;
      }

      function replaceModelText(model, text) {
        model.pushStackElement();
        model.pushEditOperations([], [{ range: model.getFullModelRange(), text }], () => null);
        model.pushStackElement();
      }

      function setModelText(lang, text) {
        code[lang] = text;
        if (models[lang]) replaceModelText(models[lang], text);
        else saveCode();
      }

      $('#btn-format').addEventListener('click', async () => {
        if (!editor || !models[currentTab]) return;
        const model = models[currentTab];
        const formatted = await formatCode(model.getValue(), currentTab);
        if (formatted === null) { flash($('#btn-format'), 'Failed'); return; }
        if (formatted !== model.getValue()) replaceModelText(model, formatted);
        flash($('#btn-format'), 'Done');
      });

      $('#btn-copy').addEventListener('click', () => {
        if (!editor) return;
        navigator.clipboard.writeText(editor.getValue())
          .then(() => flash($('#btn-copy'), 'Copied'))
          .catch(() => flash($('#btn-copy'), 'Failed'));
      });

      const btnClear = $('#btn-clear');
      let armTimer = null;
      const disarmClear = () => { btnClear.classList.remove('is-armed'); btnClear.textContent = 'Clear'; };
      btnClear.addEventListener('click', () => {
        if (!btnClear.classList.contains('is-armed')) {
          btnClear.classList.add('is-armed');
          btnClear.textContent = 'Confirm';
          clearTimeout(armTimer);
          armTimer = setTimeout(disarmClear, 2600);
          return;
        }
        clearTimeout(armTimer);
        disarmClear();
        ['html', 'css', 'javascript'].forEach(l => setModelText(l, ''));
        consoleLogs.textContent = '';
        store.set('code', code);
        render();
      });

      function extractCode(html) {
        const styles = [], scripts = [];
        const isJs = attrs => {
          if (/\ssrc\s*=/i.test(attrs)) return false;
          const t = (attrs.match(/\stype\s*=\s*["']?([^"'\s>]+)/i) || [])[1] || '';
          return !t || /^(module|text\/javascript|application\/javascript|text\/ecmascript|application\/ecmascript)$/i.test(t);
        };
        html = String(html ?? '').replace(/<style[^>]*>([\s\S]*?)<\/style>/gi, (m, inner) => {
          if (inner.trim()) styles.push(inner.trim());
          return '';
        });
        html = html.replace(/<script([^>]*)>([\s\S]*?)<\/script>/gi, (m, attrs, inner) => {
          if (!isJs(attrs)) return m;
          if (inner.trim()) scripts.push(inner.trim());
          return '';
        });
        return { html, styles, scripts };
      }

      function parseImportedHtml(text) {
        const ex = extractCode(text);
        const body = ex.html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        return {
          html: (body ? body[1] : ex.html).trim(),
          css: ex.styles.join('\n\n'),
          js: ex.scripts.join('\n\n')
        };
      }

      function applyImport(name, text) {
        const ext = (name.split('.').pop() || '').toLowerCase();
        if (ext === 'css') {
          setModelText('css', text);
          setTab('css');
          return;
        }
        if (ext === 'js' || ext === 'mjs') {
          setModelText('javascript', text);
          setTab('javascript');
          return;
        }
        const parsed = parseImportedHtml(text);
        setModelText('html', parsed.html || text);
        if (parsed.css) setModelText('css', parsed.css);
        if (parsed.js) setModelText('javascript', parsed.js);
        setTab('html');
      }

      const fileImport = $('#file-import');
      $('#btn-import').addEventListener('click', () => fileImport.click());
      fileImport.addEventListener('change', async () => {
        const file = fileImport.files && fileImport.files[0];
        fileImport.value = '';
        if (!file) return;
        try {
          applyImport(file.name, await file.text());
          render();
          pulsePreview();
          flash($('#btn-import'), 'Imported');
        } catch {
          flash($('#btn-import'), 'Failed');
        }
      });

      async function saveFile(data, suggestedName, mime, pickerAccept) {
        if (window.showSaveFilePicker) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName,
              types: [{ description: pickerAccept.desc, accept: { [mime.split(';')[0]]: pickerAccept.exts } }]
            });
            const stream = await handle.createWritable();
            await stream.write(data);
            await stream.close();
            return 'Saved';
          } catch (err) {
            if (err?.name === 'AbortError') return '';
          }
        }
        try {
          const url = URL.createObjectURL(new Blob([data], { type: mime }));
          const a = Object.assign(document.createElement('a'), { href: url, download: suggestedName });
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          return 'Exported';
        } catch {
          if (typeof data === 'string') {
            try {
              await navigator.clipboard.writeText(data);
              return 'Copied';
            } catch {}
          }
          return 'Failed';
        }
      }

      function makeZip(files) {
        const enc = new TextEncoder();
        const table = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
          table[n] = c >>> 0;
        }
        const crc32 = u8 => {
          let c = 0xFFFFFFFF;
          for (let i = 0; i < u8.length; i++) c = table[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
          return (c ^ 0xFFFFFFFF) >>> 0;
        };
        const d = new Date();
        const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >>> 1);
        const dosDate = (((d.getFullYear() - 1980) & 0x7F) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
        const parts = [];
        const entries = [];
        let offset = 0;
        for (const f of files) {
          const name = enc.encode(f.name);
          const data = enc.encode(f.text);
          const crc = crc32(data);
          const head = new DataView(new ArrayBuffer(30));
          head.setUint32(0, 0x04034b50, true);
          head.setUint16(4, 20, true);
          head.setUint16(6, 0x0800, true);
          head.setUint16(8, 0, true);
          head.setUint16(10, dosTime, true);
          head.setUint16(12, dosDate, true);
          head.setUint32(14, crc, true);
          head.setUint32(18, data.length, true);
          head.setUint32(22, data.length, true);
          head.setUint16(26, name.length, true);
          head.setUint16(28, 0, true);
          parts.push(new Uint8Array(head.buffer), name, data);
          entries.push({ name, size: data.length, crc, offset });
          offset += 30 + name.length + data.length;
        }
        const cdStart = offset;
        let cdSize = 0;
        for (const e of entries) {
          const head = new DataView(new ArrayBuffer(46));
          head.setUint32(0, 0x02014b50, true);
          head.setUint16(4, 20, true);
          head.setUint16(6, 20, true);
          head.setUint16(8, 0x0800, true);
          head.setUint16(10, 0, true);
          head.setUint16(12, dosTime, true);
          head.setUint16(14, dosDate, true);
          head.setUint32(16, e.crc, true);
          head.setUint32(20, e.size, true);
          head.setUint32(24, e.size, true);
          head.setUint16(28, e.name.length, true);
          head.setUint32(42, e.offset, true);
          parts.push(new Uint8Array(head.buffer), e.name);
          cdSize += 46 + e.name.length;
        }
        const eocd = new DataView(new ArrayBuffer(22));
        eocd.setUint32(0, 0x06054b50, true);
        eocd.setUint16(8, entries.length, true);
        eocd.setUint16(10, entries.length, true);
        eocd.setUint32(12, cdSize, true);
        eocd.setUint32(16, cdStart, true);
        parts.push(new Uint8Array(eocd.buffer));
        return new Blob(parts, { type: 'application/zip' });
      }

      const btnDl = $('#btn-dl'), exportMenu = $('#export-menu');
      const closeExportMenu = () => {
        exportMenu.classList.remove('is-open');
        btnDl.setAttribute('aria-expanded', 'false');
      };
      btnDl.addEventListener('click', () => {
        const open = exportMenu.classList.toggle('is-open');
        btnDl.setAttribute('aria-expanded', String(open));
      });
      async function doExport(mode) {
        if (mode === 'split') {
          return saveFile(makeZip(buildSplitFiles()), 'suieditor.zip', 'application/zip', { desc: 'ZIP', exts: ['.zip'] });
        }
        const css = code.css.replace(/\r\n?/g, '\n').trim();
        const js = code.javascript.replace(/\r\n?/g, '\n').trim();
        return saveFile(composeExport(code.html, css, js), 'index.html', 'text/html;charset=utf-8', { desc: 'HTML', exts: ['.html'] });
      }

      exportMenu.querySelectorAll('[data-export]').forEach(b => {
        b.addEventListener('click', async () => {
          closeExportMenu();
          const result = await doExport(b.dataset.export);
          if (result) flash(btnDl, result);
        });
      });

      function minContentSize(el) {
        if (!el) return 0;
        const prev = el.style.width;
        el.style.width = 'min-content';
        const w = el.offsetWidth;
        el.style.width = prev;
        return w;
      }

      function computeLimits() {
        const vert = window.innerWidth <= 720;
        const vv = window.visualViewport;
        const total = Math.max(200, vert
          ? Math.min(window.innerHeight, vv ? vv.height : window.innerHeight)
          : window.innerWidth);
        const pad = vert ? 8 : 10;
        const gap = vert ? 8 : 10;
        const fudge = vert ? 13 : 15;
        const appSize = total - pad * 2;
        const editNav = $('#edit .pane-nav'), viewNav = $('.pane-nav', view);
        const consoleOpen = !consolePane.classList.contains('is-hidden');
        const lineH = (window.monaco && editor)
          ? editor.getOption(monaco.editor.EditorOption.lineHeight) : 23;
        let minEditPx, viewMinPx;
        if (vert) {
          const editNavH = editNav?.offsetHeight || 46;
          const viewNavH = viewNav?.offsetHeight || 46;
          if (consoleOpen) {
            minEditPx = editNavH;
            viewMinPx = viewNavH + gap + (consolePane?.offsetHeight || 0);
          } else {
            minEditPx = editNavH + lineH * 5 + 24;
            viewMinPx = viewNavH + lineH * 5;
          }
        } else {
          minEditPx = Math.max(140, minContentSize(editNav) + 2);
          viewMinPx = Math.max(120, minContentSize(viewNav) + 2);
        }
        const maxEditPx = Math.max(0, appSize - gap * 2 - 10 - viewMinPx);
        const minEditUse = Math.min(minEditPx, maxEditPx);
        return {
          vert, total, pad, fudge, appSize,
          minEditPx: minEditUse,
          maxEditPx,
          minS: Math.max(0, (minEditUse + fudge) / appSize * 100),
          maxS: Math.max(0, Math.min(100, (maxEditPx + fudge) / appSize * 100))
        };
      }

      function setSplit(pct, L) {
        L = L || computeLimits();
        pct = Math.max(L.minS, Math.min(L.maxS, pct));
        document.body.style.setProperty('--s', pct + '%');
        divider.setAttribute('aria-valuenow', String(Math.round(pct)));
      }

      function clampDivider() {
        const L = computeLimits();
        divider.setAttribute('aria-valuemin', String(Math.round(L.minS)));
        divider.setAttribute('aria-valuemax', String(Math.round(L.maxS)));
        setSplit(parseFloat(document.body.style.getPropertyValue('--s')) || 50, L);
      }

      let isDragging = false, dragLimits = null;
      divider.addEventListener('pointerdown', e => {
        isDragging = true;
        dragLimits = computeLimits();
        divider.setPointerCapture(e.pointerId);
        document.body.classList.add('is-dragging');
        $('#edit').style.transition = 'none';
      });
      divider.addEventListener('pointermove', e => {
        if (!isDragging || !dragLimits) return;
        const { vert, pad, appSize, fudge, minEditPx, maxEditPx } = dragLimits;
        const current = vert ? e.clientY : e.clientX;
        const editPx = Math.max(minEditPx, Math.min(maxEditPx, current - pad));
        setSplit((editPx + fudge) / appSize * 100, dragLimits);
      });
      const stopDrag = e => {
        if (!isDragging) return;
        isDragging = false;
        dragLimits = null;
        try { divider.releasePointerCapture(e.pointerId); } catch {}
        document.body.classList.remove('is-dragging');
        $('#edit').style.transition = '';
      };
      divider.addEventListener('pointerup', stopDrag);
      divider.addEventListener('pointercancel', stopDrag);
      divider.addEventListener('keydown', e => {
        const d = { ArrowLeft: -2, ArrowUp: -2, ArrowRight: 2, ArrowDown: 2 }[e.key];
        if (!d) return;
        e.preventDefault();
        setSplit((parseFloat(document.body.style.getPropertyValue('--s')) || 50) + d);
      });

      let prevVH = 0, splitBeforeKeyboard = null;
      function syncViewportHeight() {
        const vv = window.visualViewport;
        if (!vv) return;
        if (window.innerWidth <= 720) {
          const h = Math.round(vv.height);
          document.body.style.height = h + 'px';
          const y = Math.round(vv.offsetTop || 0);
          document.body.style.transform = y ? 'translateY(' + y + 'px)' : '';
          if (prevVH && prevVH - h > 120 && splitBeforeKeyboard === null) {
            splitBeforeKeyboard = parseFloat(document.body.style.getPropertyValue('--s')) || 50;
          } else if (prevVH && h - prevVH > 120 && splitBeforeKeyboard !== null) {
            document.body.style.setProperty('--s', splitBeforeKeyboard + '%');
            splitBeforeKeyboard = null;
          }
          prevVH = h;
        } else if (document.body.style.height) {
          document.body.style.height = '';
          document.body.style.transform = '';
          prevVH = 0;
          splitBeforeKeyboard = null;
        }
        clampDivider();
      }

      render();
      positionThumb();
      clampDivider();
      syncViewportHeight();
      requestAnimationFrame(() => seg.classList.add('is-ready'));
      addEventListener('resize', () => { positionThumb(); clampDivider(); });
      addEventListener('load', () => { positionThumb(); clampDivider(); });
      window.visualViewport?.addEventListener('resize', syncViewportHeight);
      window.visualViewport?.addEventListener('scroll', syncViewportHeight);
    })();
  </script>
</body>
</html>
