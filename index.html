  <meta property="og:title" content="SuiEditor | その場で実行できるHTML・CSS・JSオンラインエディタ">
  <meta property="og:description" content="環境構築は不要。HTML・CSS・JavaScript を編集するとリアルタイムプレビューされ、専用コンソール、Prettier による厳格なコード整形、Emmet、CDNライブラリのワンクリック追加、ファイル読み込み、一括・分割（ZIP）選択式のファイル書き出しまで揃った無料のモダンオンラインエディタ。">

  <meta property="og:image" content="https://5u.pages.dev/ogp.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="SuiEditor のブランドマークとサービス名をグレースケールでデザインした画像">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SuiEditor | その場で実行できるHTML・CSS・JSオンラインエディタ">
  <meta name="twitter:description" content="環境構築は不要。HTML・CSS・JavaScript を編集するとリアルタイムプレビューされ、専用コンソール、Prettier による厳格なコード整形、Emmet、CDNライブラリのワンクリック追加、ファイル読み込み、一括・分割（ZIP）選択式のファイル書き出しまで揃った無料のモダンオンラインエディタ。">
  <meta name="twitter:image" content="https://5u.pages.dev/ogp.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "SuiEditor",
    "url": "https://5u.pages.dev/",
    "description": "環境構築は不要。HTML・CSS・JavaScript を編集するとリアルタイムプレビューされ、専用コンソール、Prettier による厳格なコード整形、Emmet、CDNライブラリのワンクリック追加、ファイル読み込み、一括・分割（ZIP）選択式のファイル書き出しまで揃った無料のモダンオンラインエディタ。",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Any",
    "browserRequirements": "JavaScript を有効にする必要があります。",
    "inLanguage": "ja",
    "isAccessibleForFree": true,
    "screenshot": "https://5u.pages.dev/ogp.png",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
    "featureList": [
      "HTML・CSS・JavaScript エディタ",
      "リアルタイムプレビュー",
      "JavaScript コンソール",
      "Prettier による厳格なコード整形（Strict 設定）",
      "Emmet 入力支援",
      "CDNライブラリのワンクリック追加",
      "初期コード復帰 / 全消去を選べるクリア",
      "HTML / CSS / JS ファイルの読み込み",
      "一括 / 分割（ZIP）でのファイル書き出し",
      "インストール不要"
    ]
  }
  </script>

  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
    (() => {
      let t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

  <script defer src="https://unpkg.com/prettier@3.2.5/standalone.js"></script>
  <script defer src="https://unpkg.com/prettier@3.2.5/plugins/html.js"></script>
  <script defer src="https://unpkg.com/prettier@3.2.5/plugins/postcss.js"></script>
  <script defer src="https://unpkg.com/prettier@3.2.5/plugins/babel.js"></script>
  <script defer src="https://unpkg.com/prettier@3.2.5/plugins/estree.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script defer src="https://unpkg.com/emmet-monaco-es/dist/emmet-monaco.min.js"></script>
</head>
<body>
  <noscript>
    <div class="noscript">SuiEditor の利用には JavaScript が必要です。ブラウザの設定をご確認ください。</div>
  </noscript>

  <main class="app">
    <section class="pane" id="edit" aria-label="コードエディタ">
      <nav class="pane-nav" aria-label="エディタ操作">
        <h1 class="brand">
          <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect width="100" height="100" rx="26" fill="currentColor"/><path class="stroke" d="M34 36 48 50 34 64"/><path class="stroke" d="M56 34 70 66"/></svg>
          SuiEditor
        </h1>
        <div class="segmented" role="tablist" aria-label="編集するコード">
          <span class="thumb" aria-hidden="true"></span>
          <button type="button" role="tab" data-tab="html" class="is-active" aria-selected="true">HTML</button>
          <button type="button" role="tab" data-tab="css" aria-selected="false">CSS</button>
          <button type="button" role="tab" data-tab="javascript" aria-selected="false">JS</button>
        </div>
        <div class="actions">
          <button type="button" id="btn-format" class="btn" data-tip="Prettier の厳格設定でコードを整形">Format</button>
          <button type="button" id="btn-copy" class="btn" data-tip="現在のタブのコードをコピー">Copy</button>
          <button type="button" id="btn-clear" class="btn" data-tip="クリア方法を選択して実行">Clear</button>
          <div class="export-wrap cdn-wrap">
            <button type="button" id="btn-cdn" class="btn" data-tip="CDNライブラリをワンクリックで追加" aria-haspopup="true" aria-expanded="false" aria-controls="cdn-menu">CDN</button>
            <div class="win-menu win-menu--cdn" id="cdn-menu" aria-label="CDNライブラリの追加">
              <header class="win-head">
                <span class="win-badge win-badge--cdn" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 1 0-5.7-5.7l-1.2 1.2"/><path d="M13.5 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 1 0 5.7 5.7l1.2-1.2"/></svg>
                </span>
                <span class="win-head-text">
                  <strong class="win-title">CDN ライブラリ</strong>
                  <span class="win-desc">検索してワンクリックで追加できます</span>
                </span>
              </header>
              <label class="cdn-search">
                <input type="search" id="cdn-search" placeholder="ライブラリを検索…" aria-label="ライブラリを検索" autocomplete="off" spellcheck="false">
              </label>
              <div class="cdn-list" id="cdn-list"></div>
              <form class="cdn-custom" id="cdn-custom-form">
                <input type="url" id="cdn-custom-url" placeholder="https://cdn.example.com/lib.min.js" aria-label="追加するCDNのURL" required>
                <div class="cdn-kind" role="radiogroup" aria-label="ファイル種別">
                  <label><input type="radio" name="cdn-kind" value="js" checked>JS</label>
                  <label><input type="radio" name="cdn-kind" value="css">CSS</label>
                </div>
                <button type="submit" class="cdn-add">追加</button>
              </form>
              <p class="cdn-note">有効にしたライブラリは、プレビューと書き出し（index.html）に自動反映されます。</p>
            </div>
          </div>
          <button type="button" id="btn-import" class="btn" data-tip="HTML / CSS / JS ファイルを読み込む">Import</button>
          <div class="export-wrap">
            <button type="button" id="btn-dl" class="btn" data-tip="一括 / 分割を選んで書き出し" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">Export</button>
            <div class="win-menu win-menu--export" id="export-menu" role="menu" aria-label="書き出し形式を選択">
              <header class="win-head">
                <span class="win-badge win-badge--export" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19h14"/></svg>
                </span>
                <span class="win-head-text">
                  <strong class="win-title">エクスポート</strong>
                  <span class="win-desc">書き出し形式を選択してください</span>
                </span>
              </header>
              <div class="win-body">
                <button type="button" role="menuitem" class="win-item" data-export="single">
                  <span class="win-item-title">一括（1ファイル）</span>
                  <span class="win-item-desc">外部参照の CSS・JS を HTML に統合して index.html を書き出します</span>
                </button>
                <button type="button" role="menuitem" class="win-item" data-export="split">
                  <span class="win-item-title">分割（3ファイル）</span>
                  <span class="win-item-desc">HTML 内の CSS・JS を抽出し、index.html / style.css / script.js の ZIP で書き出します</span>
                </button>
              </div>
            </div>
          </div>
          <input type="file" id="file-import" accept=".html,.htm,.css,.js,.mjs,text/html,text/css,text/javascript" hidden>
        </div>
      </nav>
      <div class="editor-container">
        <div id="monaco-editor"></div>
      </div>
    </section>

    <div id="divider" role="separator" aria-orientation="vertical" aria-label="エディタとプレビューの境界" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50" tabindex="0"></div>

    <div id="view-container">
      <section class="pane" id="view" aria-label="プレビュー">
        <nav class="pane-nav" aria-label="プレビュー操作">
          <span class="pane-label">Preview</span>
          <div class="actions">
            <button type="button" id="preview-theme-toggle" class="icon-btn" data-tip="プレビューのテーマを切り替え" aria-label="プレビューのテーマを切り替え" aria-pressed="false">
              <svg class="preview-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
              <svg class="preview-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button type="button" id="btn-toggle-console" class="btn" data-tip="コンソールの表示切り替え" aria-controls="console-pane" aria-expanded="false">Console</button>
          </div>
        </nav>
        <div class="preview-wrapper">
          <iframe id="preview" title="SuiEditor プレビュー" sandbox="allow-scripts allow-forms allow-modals"></iframe>
        </div>
      </section>

      <section id="console-pane" class="is-hidden" role="region" aria-label="コンソール">
        <div class="console-clip">
          <div class="console-card">
            <nav class="console-head" aria-label="コンソール操作">
              <span class="pane-label">Console</span>
              <div class="actions">
                <button type="button" id="btn-clear-console" class="btn" data-tip="ログを消去">Clear</button>
              </div>
            </nav>
            <div id="console-logs" role="log" aria-live="polite"></div>
            <div class="console-input-row">
              <span class="g" aria-hidden="true">&rsaquo;</span>
              <input type="text" id="console-input" placeholder="JavaScriptを実行" aria-label="プレビュー内でJavaScriptを実行" autocomplete="off" autocapitalize="off" spellcheck="false">
              <button type="button" id="console-jump" class="console-jump" data-tip="最新のログまでスクロール" aria-label="最新のログまでスクロール">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <dialog id="clear-dialog" aria-labelledby="clear-title">
    <header class="win-head">
      <span class="win-badge win-badge--danger" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M6.5 7l.8 12A1.5 1.5 0 0 0 8.8 20.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12"/><path d="M10 11v6M14 11v6"/></svg>
      </span>
      <span class="win-head-text">
        <strong class="win-title" id="clear-title">コードのクリア</strong>
        <span class="win-desc">実行する操作を選択してください。この操作は取り消せません。</span>
      </span>
    </header>
    <div class="win-body">
      <button type="button" class="win-item" data-clear="reset">
        <span class="win-item-title">① 初期コードに戻す</span>
        <span class="win-item-desc">3タブをデフォルトのスターターコードに戻します</span>
      </button>
      <button type="button" class="win-item" data-clear="empty">
        <span class="win-item-title">② すべて空にする</span>
        <span class="win-item-desc">3タブすべてのコードを完全に消去します</span>
      </button>
    </div>
    <footer class="win-foot">
      <button type="button" class="win-cancel" data-clear="cancel" autofocus>キャンセル</button>
    </footer>
  </dialog>

  <script type="module" src="script.js"></script>
</body>
</html>
